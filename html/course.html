<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Educom - צפייה בקורס</title>
    <link rel="icon" type="image/png" href="../asset/logo.png?v=1" />
    <link rel="apple-touch-icon" href="../asset/logo.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    
    <!-- Quill.js & Highlight.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  </head>
  <body>
    <nav id="main-nav"></nav>
    .

    <script src="../js/loader.js"></script>

    <div class="course-page-wrapper reveal">
      <!-- Mobile Toggle Button (Visible only on mobile via CSS) -->
      <div class="mobile-toggle-wrapper" style="display: none; order: 1">
        <button id="mobile-lesson-toggle">
          <i class="fas fa-list"></i> הצג רשימת שיעורים
        </button>
      </div>

      <aside class="course-sidebar">
        <div class="sidebar-header">תוכן הקורס</div>
        <ul class="lesson-list" id="lessonList"></ul>
      </aside>

      <main class="course-main-content" id="main-scroll-container">
        <div class="course-header">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <h1 id="course-title">טוען קורס...</h1>
            <button
              id="btn-wishlist-course"
              class="btn-wishlist-toggle"
              style="display: none"
              title="הוסף לרשימת המשאלות"
            >
              <i class="far fa-heart"></i>
            </button>
          </div>

          <div id="course-author-info" class="course-page-author-info">
            <!-- Author info will be injected here -->
          </div>

          <div id="average-rating" class="average-rating-container">
            <!-- Average rating inserted here -->
          </div>
        </div>

        <!-- Container for all sections (Spy Scroll) -->
        <div id="course-sections-list" class="sections-container">
          <!-- Sections will be injected here by JS -->
          <div class="loading-spinner">טוען תכנים...</div>
        </div>

        <section class="reviews-area" id="reviews-section">
          <div class="reviews-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <i class="fas fa-star"></i>
              <h3>מה הסטודנטים אומרים</h3>
            </div>
            <button id="aiSummarizeReviewsBtn" class="ai-generate-btn" style="font-size: 0.85rem; padding: 7px 12px; display: none;">
              <i class="fas fa-chart-pie"></i> סכם ביקורות (AI)
            </button>
          </div>

          <div class="add-review-container">
            <div class="rating-selector">
              <span class="star" data-value="5">★</span>
              <span class="star" data-value="4">★</span>
              <span class="star" data-value="3">★</span>
              <span class="star" data-value="2">★</span>
              <span class="star" data-value="1">★</span>
              <p>דרג את הקורס:</p>
            </div>
            <div class="input-wrapper">
              <textarea
                id="reviewText"
                placeholder="שתף אותנו בחווית הלמידה שלך..."
              ></textarea>
              <button id="submitReviewBtn" class="btn-send-review">
                <i class="fas fa-paper-plane"></i>
                שלח ביקורת
              </button>
            </div>
          </div>

          <div id="reviews-list" class="reviews-feed">
            <div class="loading-reviews">טוען ביקורות...</div>
          </div>
        </section>

    <!-- AI Sentiment Summary Modal -->
    <div id="aiSentimentModalOverlay" class="ai-modal-overlay" style="display: none;">
      <div class="ai-result-modal" style="max-width: 600px;">
        <div class="ai-modal-header">
          <div class="ai-modal-title"><i class="fas fa-chart-pie"></i> ניתוח ביקורות (AI)</div>
          <button id="aiSentimentCloseBtn" class="ai-icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="ai-modal-body">
          <div id="aiSentimentLoading" class="ai-modal-loading" style="display: none;">
             <div class="typing-indicator" style="justify-content: center;">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
             </div>
             <p style="text-align: center; color: #666; font-size: 0.9rem; margin-top: 10px;">מנתח ביקורות...</p>
          </div>
          <div id="aiSentimentContent" class="ai-modal-text"></div>
        </div>
        <div class="ai-modal-footer"></div>
      </div>
    </div>
      </main>
    </div>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/courses-data.js"></script>
    <script type="module" src="../js/course-logic.js"></script>
    <script src="../js/navbar.js"></script>

    <!-- Highlight.js Script for code blocks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <!-- AI Student Context Menu & Modal -->
    <div id="aiContextMenu" class="ai-context-menu" style="display: none">
      <button id="aiBtnExplain" class="ai-context-btn">
        <i class="fas fa-magic"></i> הסבר
      </button>
      <button id="aiBtnExpand" class="ai-context-btn">
        <i class="fas fa-expand-arrows-alt"></i> הרחב
      </button>
    </div>

    <!-- AI Result Modal -->
    <div
      id="aiResultModalOverlay"
      class="ai-modal-overlay"
      style="display: none"
    >
      <div class="ai-result-modal">
        <div class="ai-modal-header">
          <div class="ai-modal-title">
            <i class="fas fa-robot"></i> העוזר האישי שלך
          </div>
          <button id="aiModalCloseBtn" class="ai-icon-btn">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="ai-modal-body">
          <div
            id="aiModalLoading"
            class="ai-modal-loading"
            style="display: none"
          >
            <div class="typing-indicator" style="justify-content: center">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
            <p
              style="
                text-align: center;
                color: #666;
                font-size: 0.9rem;
                margin-top: 10px;
              "
            >
              מייצר תשובה חכמה במיוחד עבורך...
            </p>
          </div>
          <div id="aiModalContent" class="ai-modal-text"></div>
        </div>
        <div class="ai-modal-footer">
          <!-- Optional: settings btn in modal if no key was provided -->
          <div id="studentAiSettings" style="display: none; width: 100%">
            <label style="font-size: 0.8rem; color: #555"
              >הכנס מפתח API כדי להשתמש בעוזר:</label
            >
            <div style="display: flex; gap: 5px; margin-top: 5px">
              <input
                type="password"
                id="studentApiKey"
                placeholder="sk-..."
                style="
                  flex: 1;
                  padding: 5px;
                  border: 1px solid #ccc;
                  border-radius: 4px;
                "
              />
              <button
                id="saveStudentKeyBtn"
                class="btn-save"
                style="padding: 5px 10px; font-size: 0.8rem"
              >
                שמור
              </button>
            </div>
          </div>
            </div>
      </div>
    </div>
    
    <!-- AI Quiz Modal -->
    <div id="aiQuizModalOverlay" class="ai-modal-overlay" style="display: none;">
      <div class="ai-result-modal" style="max-width: 600px;">
        <div class="ai-modal-header">
          <div class="ai-modal-title"><i class="fas fa-brain"></i> בוחן פתע (AI)</div>
          <button id="aiQuizCloseBtn" class="ai-icon-btn"><i class="fas fa-times"></i></button>
        </div>
        <div class="ai-modal-body" id="aiQuizBody">
          <div id="aiQuizLoading" class="ai-modal-loading" style="display: none;">
             <div class="typing-indicator" style="justify-content: center;">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
             </div>
             <p style="text-align: center; color: #666; font-size: 0.9rem; margin-top: 10px;">מייצר שאלות מתוך החומר...</p>
          </div>
          <div id="aiQuizContent"></div>
          <div id="aiQuizScore" style="display: none; text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 15px;"></div>
        </div>
        <div class="ai-modal-footer">
          <button id="aiQuizSubmitBtn" class="btn-save" style="display: none;">בדוק תשובות</button>
        </div>
      </div>
    </div>
  </body>
</html>
